name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: |
          pytest tests/ -q \
            --deselect tests/unit/test_story049_community_standards.py \
            --deselect tests/unit/test_story063_prompt_slimming.py::TestAC7PromptSizeReduced::test_total_size_reduced_15_percent \
            --deselect tests/unit/test_story_slim026.py::TestAC5CharCount::test_plan_prompt_not_longer_than_baseline \
            --deselect tests/unit/test_story_slim077_monorepo_stack.py::TestUpdateYamlStack::test_ac4_update_yaml_stack \
            --deselect tests/unit/test_statusline.py::TestModelAndDirectory::test_model_name_shown

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
