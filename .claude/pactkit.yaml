# PactKit Configuration
# Only override non-default values. Absent keys = default (all enabled).

stack: python
developer: "slim"

ci:
  provider: github
  install_cmd: "python -m pip install --upgrade pip\n          pip install -e \".[visualize]\"\n          pip install pytest ruff\n          pactkit init"

issue_tracker:
  provider: github

release:
  github_release: true

# STORY-slim-202608289e83eeb30df4: PactKit's own release flow direct-pushes
# main, and maintainers must be able to edit hooks — stand both gates down.
enforcement:
  protected_branches: ["main", "master"]
  allow_direct_push: true
  tamper_guard: false

visualize:
  graph_provider: codegraph

agent_models:
  code-explorer: haiku
  product-designer: opus
  system-architect: opus
  system-medic: haiku
